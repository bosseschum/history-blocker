<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Blocker</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: color-mix(in srgb, currentColor 20%, transparent);
        --muted: color-mix(in srgb, currentColor 60%, transparent);
        --accent: #2563eb;
        --error: #dc2626;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        font: 14px/1.4 system-ui, sans-serif;
      }
      h1 { font-size: 16px; margin: 0 0 12px; }
      h2 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
      button, input {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary {
        width: 100%;
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        margin-bottom: 10px;
      }
      #add-form { display: flex; gap: 6px; }
      #domain-input { flex: 1; min-width: 0; }
      #message { min-height: 1.4em; margin: 6px 0 0; font-size: 13px; color: var(--muted); }
      #message.error { color: var(--error); }
      #blocklist {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow-y: auto;
      }
      #blocklist li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      #blocklist span { overflow-wrap: anywhere; }
      #empty { color: var(--muted); margin: 0; }
    </style>
  </head>
  <body>
    <h1>History Blocker</h1>

    <button id="block-current" type="button" class="primary" disabled>Block this site</button>

    <form id="add-form">
      <input
        id="domain-input"
        type="text"
        placeholder="example.com"
        aria-label="Domain to block"
        autocomplete="off"
        spellcheck="false"
        required
      />
      <button type="submit">Add</button>
    </form>
    <p id="message" role="status"></p>

    <h2>Blocked sites</h2>
    <p id="empty">No sites blocked yet.</p>
    <ul id="blocklist"></ul>

    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
