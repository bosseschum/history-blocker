<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Blocker</title>
    <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light dark;--border:color-mix(in srgb, currentColor 20%, transparent);--muted:color-mix(in srgb, currentColor 60%, transparent);--accent:#2563eb;--error:#dc2626}@media (prefers-color-scheme:dark){:root{--lightningcss-light: ;--lightningcss-dark:initial}}body{width:340px;margin:0;padding:16px;font:14px/1.4 system-ui,sans-serif}h1{margin:0 0 12px;font-size:16px}h2{color:var(--muted);margin:16px 0 6px;font-size:13px;font-weight:600}button,input{font:inherit;border:1px solid var(--border);color:inherit;background:0 0;border-radius:6px;padding:6px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;margin-bottom:10px}#add-form{gap:6px;display:flex}#domain-input{flex:1;min-width:0}#message{min-height:1.4em;color:var(--muted);margin:6px 0 0;font-size:13px}#message.error{color:var(--error)}#blocklist{max-height:220px;margin:0;padding:0;list-style:none;overflow-y:auto}#blocklist li{border-bottom:1px solid var(--border);justify-content:space-between;align-items:center;gap:8px;padding:6px 0;display:flex}#blocklist span{overflow-wrap:anywhere}#empty{color:var(--muted);margin:0}</style>
    <script type="module" crossorigin src="./popup.js"></script>
    <link rel="modulepreload" crossorigin href="./chunks/storage.js">
  </head>
  <body>
    <h1>History Blocker</h1>

    <button id="block-current" type="button" class="primary" disabled>Block this site</button>

    <form id="add-form">
      <input
        id="domain-input"
        type="text"
        placeholder="example.com"
        aria-label="Domain to block"
        autocomplete="off"
        spellcheck="false"
        required
      />
      <button type="submit">Add</button>
    </form>
    <p id="message" role="status"></p>

    <h2>Blocked sites</h2>
    <p id="empty">No sites blocked yet.</p>
    <ul id="blocklist"></ul>

  </body>
</html>
